[package]
name = "cgeos2-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open-source Linux CLI for exercising CGEOS2 access and client services."

[[bin]]
name = "cgeos2"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
cgeos-access-service = { path = "../access-service" }
cgeos-sdk-shared = { path = "../client-service/crates/shared", features = ["native", "debug-pass"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "=2.5.8"

[profile.release]
lto = true
strip = true
