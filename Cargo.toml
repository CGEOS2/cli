[package]
name = "cgeos2-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Open-source Linux CLI for exercising CGEOS2 access and client services."

[[bin]]
name = "cgeos2"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
base64 = "0.22"
cgeos-access-service = { path = "../access-service" }
cgeos-sdk-tenant = { path = "../client-service/crates/tenant" }
cgeos-sdk-shared = { path = "../client-service/crates/shared", features = ["native", "debug-pass"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "=2.5.8"
# Presigned PUT with the same pinned client and system roots as the SDK login path.
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs"] }

# Current-user Windows DPAPI for the saved login (other platforms keep the session in memory only).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
lto = true
strip = true
